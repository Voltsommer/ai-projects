name: Project 03 CI

on:
  push:
    paths:
      - "03-数据问答助手/**"
      - ".github/workflows/project-03-ci.yml"
  pull_request:
    paths:
      - "03-数据问答助手/**"
      - ".github/workflows/project-03-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03-数据问答助手

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 03-数据问答助手/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run offline tests
        env:
          APP_ENV: test
        run: python -m unittest discover -s tests -v

      - name: Compile Python modules
        run: python -m compileall -q .

      - name: Verify sample database creation
        run: python init_db.py && python -c "import sqlite3; conn=sqlite3.connect('sales.db'); assert conn.execute('SELECT COUNT(*) FROM sales').fetchone()[0] == 12; conn.close()"

      - name: Smoke test Streamlit without API key
        env:
          APP_ENV: test
        run: |
          streamlit run app.py --server.headless=true --server.port=8501 &
          APP_PID=$!
          trap "kill $APP_PID" EXIT
          python - <<'PY'
          import time
          from urllib.request import urlopen

          for _ in range(30):
              try:
                  with urlopen("http://127.0.0.1:8501/_stcore/health", timeout=2) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except OSError:
                  time.sleep(1)
          raise SystemExit("Streamlit health check failed")
          PY
